name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl git make xz-utils clang lld

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install patched iOS 15.6 SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS15.6.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: JBToolbox-rootless-deb
          path: packages/*.deb
