name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Show environment
        run: |
          echo "THEOS=$THEOS"
          echo "Available SDKs:"
          ls -la "$THEOS/sdks" || true
          echo "Toolchain:"
          ls -la "$THEOS/toolchain/linux/iphone/bin" | head || true

      - name: Build Rootless Package
        run: |
          rm -rf .theos packages
          make package FINALPACKAGE=1 messages=yes

      - name: Show generated packages
        if: success()
        run: |
          echo "Generated DEBs:"
          find packages -type f -name "*.deb" -print

      - name: Upload DEB
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: JBToolbox-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
