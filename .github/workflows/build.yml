name: Build Rootless DEB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build JBToolbox
    runs-on: macos-15

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install dependencies
        run: |
          brew update
          brew install ldid || true

      - name: Install Theos
        run: |
          rm -rf "$THEOS"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"

          echo "THEOS = $THEOS"
          test -f "$THEOS/makefiles/common.mk"

      - name: Configure project
        run: |
          echo "===== OLD MAKEFILE ====="
          cat Makefile

          sed -i '' \
            's/^TARGET = .*/TARGET = iphone:clang:latest:15.0/' \
            Makefile

          echo "===== NEW MAKEFILE ====="
          cat Makefile

      - name: Verify files
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== SOURCES ====="
          find Sources -type f -maxdepth 2 -print

          echo "===== RESOURCES ====="
          find Resources -type f -maxdepth 2 -print || true

          echo "===== CONTROL ====="
          cat control

      - name: Build package
        run: |
          rm -rf .theos packages

          make clean
          make package FINALPACKAGE=1 messages=yes

      - name: Verify DEB
        run: |
          echo "===== GENERATED DEB ====="

          find packages -type f -name "*.deb" -print

          COUNT=$(find packages -type f -name "*.deb" | wc -l | tr -d ' ')

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No DEB generated"
            exit 1
          fi

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: JBToolbox-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error
